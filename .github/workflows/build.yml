name: Build NoxWave

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev ninja-build

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          ART=build/NoxWave_artefacts/Release
          cp -R "$ART/VST3/NoxWave.vst3" dist/
          if [ -d "$ART/AU" ]; then cp -R "$ART/AU/NoxWave.component" dist/; fi
          if [ -d "$ART/Standalone" ]; then cp -R "$ART/Standalone/"* dist/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: NoxWave-${{ matrix.name }}
          path: dist
